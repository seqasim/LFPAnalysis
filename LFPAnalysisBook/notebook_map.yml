  - chapter: 22_translate_condensed_notebook.md
    notebook: worked-examples/22_migrating_condensed_notebook.ipynb
    required_symbols: [build_basic_pipeline_config, legacy]
    required_plot: false

smoke_tests:
  - chapter: 03_first_load.md
    notebooks:
      - smoke-tests/01_install_and_import.ipynb
      - smoke-tests/02_load_sample_data.ipynb
  - chapter: 04_first_reference.md
    notebooks:
      - smoke-tests/03_reference_and_artifacts.ipynb
  - chapter: 04b_first_synchronization.md
    notebooks:
      - smoke-tests/08_synchronization.ipynb
  - chapter: 07_first_event_locked_workflow.md
    notebooks:
      - smoke-tests/04_baselining_and_epoching.ipynb
  - chapter: 08_first_psd_and_fooof.md
    notebooks:
      - smoke-tests/05_psd_and_fooof.ipynb
  - chapter: 09_first_time_frequency.md
    notebooks:
      - smoke-tests/06_time_frequency.ipynb
  - chapter: 10_first_connectivity_and_surrogates.md
    notebooks:
      - smoke-tests/07_connectivity_and_surrogates.ipynb

# Defaults the book and builders must share.
api_contracts:
  epoch_tmax: 1.5
  epoch_tmin: -0.5
  chapter_data_prefix: ../data/
  notebook_data_prefix: ../../data/
