    required_plot: true
  - chapter: 13_assembling_analysis_dataframes.md
    notebook: worked-examples/13_assembling_dataframes.ipynb
    required_symbols: []
    required_plot: false
  - chapter: 14_group_level_statistics.md
    notebook: worked-examples/14_group_statistics.ipynb
