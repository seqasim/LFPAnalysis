# Canonical chapter ↔ notebook mapping (source of truth for TOC + tests).
# Worked-example filenames are chapter-aligned so prefixes match the teaching order.

worked_examples:
  - chapter: 03_first_load.md
    notebook: worked-examples/03_first_import_and_load.ipynb
    required_symbols: [build_basic_pipeline_config, run_pipeline]
    required_plot: true
  - chapter: 04_first_reference.md
    notebook: worked-examples/04_first_preprocessing_run.ipynb
    required_symbols: [build_basic_pipeline_config, run_pipeline]
    required_plot: true
  - chapter: 04b_first_synchronization.md
    notebook: worked-examples/04b_first_synchronization_run.ipynb
    required_symbols: [sync_utils]
    required_plot: true
  - chapter: 05_first_artifact_pass.md
    notebook: worked-examples/05_first_artifact_pass.ipynb
    required_symbols: [build_basic_pipeline_config, run_pipeline]
    required_plot: true
  - chapter: 06_first_baseline.md
    notebook: worked-examples/06_first_baseline_run.ipynb
    required_symbols: [build_analysis_config, run_analysis]
    required_plot: true
  - chapter: 07_first_event_locked_workflow.md
    notebook: worked-examples/07_first_epoching_run.ipynb
    required_symbols: [build_event_locked_pipeline_config, run_pipeline]
    required_plot: true
  - chapter: 08_first_psd_and_fooof.md
    notebook: worked-examples/08_first_psd_and_fooof_run.ipynb
    required_symbols: [build_analysis_config, run_analysis]
    required_plot: true
  - chapter: 09_first_time_frequency.md
