    required_symbols: [build_analysis_config, run_analysis]
    required_plot: true
  - chapter: 10_first_connectivity_and_surrogates.md
    notebook: worked-examples/10_first_connectivity_run.ipynb
    required_symbols: [spectral_connectivity_epochs, make_surrogate_arrays]
