[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    -ra
    --tb=short
    --strict-config
    --strict-markers
markers =
    unit: fast pure-function or validation tests
    integration: workflow tests that compose multiple layers or use MNE objects
    notebook: notebook execution or smoke coverage
    slow: intentionally slower end-to-end coverage
    optional_dep: tests that require optional analysis dependencies
