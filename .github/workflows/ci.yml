name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install nox
        run: python -m pip install --upgrade pip nox
      - name: Run lint session
        run: nox -s lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install nox
        run: python -m pip install --upgrade pip nox
      - name: Run test session
        run: nox -s tests

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run workflow smoke test
        run: |
          python -c "from pathlib import Path; from LFPAnalysis import LoadConfig, PipelineConfig, run_pipeline; config = PipelineConfig(load=LoadConfig(path=Path('data/sample_ieeg.fif'), file_format='mne')); result = run_pipeline(config); print(result.raw.info['sfreq'])"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install nox
        run: python -m pip install --upgrade pip nox
      - name: Build Jupyter Book
        run: nox -s docs

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install nox
        run: python -m pip install --upgrade pip nox
      - name: Run smoke notebooks
        run: nox -s notebooks
